<script>
  document.addEventListener("DOMContentLoaded", function () {
    const phoneInput = document.querySelector("#aaa-phone");
    if (!phoneInput) {
      return;
    }
    const iti = window.intlTelInput(phoneInput, {
      initialCountry: "in",
      separateDialCode: true,
      countrySearch: true,
      formatAsYouType: true,
      strictMode: true,
      loadUtils: () =>
        import(
          "https://cdn.jsdelivr.net/npm/intl-tel-input@29.4.0/dist/js/utils.js"
        )
    });

    document.addEventListener(
      "wpcf7beforesubmit",
      function () {
        const fullNumber = iti.getNumber();
        if (fullNumber) {
          phoneInput.value = fullNumber;
        }
      },
      false
    );
  });
</script>
